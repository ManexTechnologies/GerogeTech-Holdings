<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drop shadow -->
  <rect x="54" y="48" width="102" height="94" rx="10" fill="black" />

  <!-- Sleeve body - dark gray neoprene -->
  <rect x="44" y="38" width="102" height="94" rx="10" fill="#4A4A4A" stroke="black" stroke-width="3.5" />

  <!-- Neoprene texture lines -->
  <line x1="54" y1="52" x2="136" y2="52" stroke="#3D3D3D" stroke-width="2" />
  <line x1="54" y1="58" x2="136" y2="58" stroke="#3D3D3D" stroke-width="2" />
  <line x1="54" y1="64" x2="136" y2="64" stroke="#3D3D3D" stroke-width="2" />

  <!-- Laptop peeking out the top -->
  <rect x="56" y="12" width="78" height="32" rx="3" fill="#D0D0D0" stroke="black" stroke-width="3" />
  <!-- Laptop screen bezel -->
  <rect x="62" y="17" width="66" height="20" rx="1" fill="#1C1C2E" stroke="black" stroke-width="2" />
  <!-- Screen glare -->
  <rect x="66" y="19" width="40" height="6" rx="1" fill="#3D5A80" opacity="0.7" />

  <!-- Laptop keyboard deck visible below screen -->
  <rect x="58" y="36" width="74" height="6" rx="1" fill="#B0B0B0" stroke="black" stroke-width="2" />

  <!-- Zipper track across sleeve -->
  <line x1="44" y1="62" x2="146" y2="62" stroke="black" stroke-width="3.5" />

  <!-- Zipper teeth - left side -->
  <rect x="48" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="56" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="64" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="72" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="80" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="88" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="96" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="104" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="112" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />
  <rect x="120" y="60" width="5" height="5" rx="1" fill="#888" stroke="black" stroke-width="1.5" />

  <!-- Zipper pull -->
  <rect x="95" y="62" width="14" height="20" rx="3" fill="#FFC107" stroke="black" stroke-width="3" />
  <circle cx="102" cy="76" r="4" fill="#FFC107" stroke="black" stroke-width="2" />

  <!-- Stitching around sleeve edge -->
  <rect x="50" y="44" width="90" height="82" rx="7" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- Sleeve bottom highlight -->
  <rect x="46" y="124" width="98" height="6" rx="3" fill="#555555" stroke="none" />
</svg>