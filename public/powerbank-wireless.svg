<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drop shadow -->
  <ellipse cx="102" cy="133" rx="68" ry="26" fill="#111" stroke="#000" stroke-width="3"/>

  <!-- Main body - rounded white -->
  <rect x="30" y="55" width="144" height="72" rx="36" fill="#f5f5f5" stroke="#000" stroke-width="3"/>

  <!-- Inner subtle rim -->
  <rect x="38" y="63" width="128" height="56" rx="28" fill="none" stroke="#000" stroke-width="1"/>

  <!-- MagSafe ring -->
  <circle cx="102" cy="91" r="22" fill="none" stroke="#999" stroke-width="3"/>
  <circle cx="102" cy="91" r="16" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- MagSafe alignment dot -->
  <circle cx="102" cy="69" r="3" fill="#aaa" stroke="#000" stroke-width="1.5"/>

  <!-- Charging indicator LED -->
  <circle cx="102" cy="77" r="2" fill="#00ff44" stroke="#000" stroke-width="1.5"/>

  <!-- USB-C port on edge -->
  <ellipse cx="30" cy="91" rx="3" ry="5" fill="#ccc" stroke="#000" stroke-width="2"/>
  <ellipse cx="30" cy="91" rx="1.5" ry="2.5" fill="#888" stroke="#000" stroke-width="1"/>

  <!-- Wireless symbol -->
  <g stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M92 97 Q102 89 112 97"/>
    <path d="M88 101 Q102 89 116 101"/>
    <path d="M84 105 Q102 89 120 105"/>
  </g>

  <!-- Label -->
  <text x="102" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">WIRELESS</text>

  <!-- Shadow line detail on body -->
  <line x1="62" y1="123" x2="142" y2="123" stroke="#ddd" stroke-width="1.5"/>
</svg>