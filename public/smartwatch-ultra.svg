<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drop shadow -->
  <circle cx="100" cy="100" r="52" fill="#222" opacity="0.3"/>

  <!-- Top rugged band -->
  <path d="M78 20 122 20 122 55 78 55Z" fill="#1a1a1a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Band ridges top -->
  <rect x="78" y="28" width="44" height="4" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="1.5"/>
  <rect x="78" y="37" width="44" height="4" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="1.5"/>
  <rect x="78" y="46" width="44" height="4" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="1.5"/>

  <!-- Bottom rugged band -->
  <path d="M78 145 122 145 122 180 78 180Z" fill="#1a1a1a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Band ridges bottom -->
  <rect x="78" y="152" width="44" height="4" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="1.5"/>
  <rect x="78" y="161" width="44" height="4" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="1.5"/>
  <rect x="78" y="170" width="44" height="4" rx="2" fill="#2a2a2a" stroke="#000" stroke-width="1.5"/>

  <!-- Outer rugged bezel -->
  <circle cx="100" cy="100" r="48" fill="#3a3a3a" stroke="#000" stroke-width="3.5"/>

  <!-- Bezel notches (rugged look) -->
  <rect x="97" y="50" width="6" height="5" fill="#555"/>
  <rect x="97" y="145" width="6" height="5" fill="#555"/>
  <rect x="50" y="97" width="5" height="6" fill="#555"/>
  <rect x="145" y="97" width="5" height="6" fill="#555"/>

  <!-- Inner bezel ring -->
  <circle cx="100" cy="100" r="38" fill="#1a1a2a" stroke="#000" stroke-width="2.5"/>

  <!-- Round AMOLED display -->
  <circle cx="100" cy="100" r="32" fill="#0a0a18" stroke="#000" stroke-width="2"/>

  <!-- Compass-style indicators on screen -->
  <line x1="100" y1="70" x2="100" y2="78" stroke="#ff6600" stroke-width="2"/>
  <line x1="100" y1="122" x2="100" y2="130" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="100" x2="78" y2="100" stroke="#888" stroke-width="1.5"/>
  <line x1="122" y1="100" x2="130" y2="100" stroke="#888" stroke-width="1.5"/>

  <!-- Screen content - large time -->
  <text x="100" y="96" text-anchor="middle" font-family="monospace, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">10:09</text>

  <!-- Small stats on screen -->
  <text x="86" y="115" text-anchor="middle" font-family="monospace, sans-serif" font-size="5" fill="#44aaff">ALT</text>
  <text x="86" y="121" text-anchor="middle" font-family="monospace, sans-serif" font-size="5" font-weight="bold" fill="#44aaff">1,240M</text>

  <text x="114" y="115" text-anchor="middle" font-family="monospace, sans-serif" font-size="5" fill="#ff6600">TEMP</text>
  <text x="114" y="121" text-anchor="middle" font-family="monospace, sans-serif" font-size="5" font-weight="bold" fill="#ff6600">22°C</text>

  <!-- Orange accent button left -->
  <rect x="46" y="90" width="12" height="20" rx="5" fill="#ff6600" stroke="#000" stroke-width="2.5"/>

  <!-- Orange accent button right top -->
  <rect x="142" y="85" width="12" height="12" rx="4" fill="#ff6600" stroke="#000" stroke-width="2.5"/>

  <!-- Crown button right -->
  <circle cx="150" cy="110" r="6" fill="#ff6600" stroke="#000" stroke-width="2.5"/>

  <!-- Crown ridges -->
  <line x1="154" y1="107" x2="154" y2="113" stroke="#000" stroke-width="1.5"/>
  <line x1="148" y1="107" x2="148" y2="113" stroke="#000" stroke-width="1.5"/>

  <!-- Bezel highlight arc -->
  <path d="M65 78 A48 48 0 0 1 135 78" fill="none" stroke="#666" stroke-width="3" opacity="0.5"/>
</svg>