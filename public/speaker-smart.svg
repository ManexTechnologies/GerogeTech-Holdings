<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Chunky drop shadow -->
  <rect x="48" y="148" width="110" height="18" rx="9" fill="#222" opacity="0.9"/>

  <!-- Smart speaker body - rounded rectangle -->
  <rect x="45" y="40" width="110" height="110" rx="22" ry="22" fill="#f0f0f0" stroke="#000" stroke-width="3"/>

  <!-- Top highlight accent -->
  <rect x="48" y="42" width="104" height="8" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>

  <!-- Speaker grille - front mesh -->
  <rect x="58" y="60" width="84" height="60" rx="10" fill="#d5d5d5" stroke="#000" stroke-width="3"/>

  <!-- Grille horizontal lines -->
  <line x1="62" y1="68" x2="138" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="74" x2="138" y2="74" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="80" x2="138" y2="80" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="86" x2="138" y2="86" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="92" x2="138" y2="92" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="98" x2="138" y2="98" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="104" x2="138" y2="104" stroke="#888" stroke-width="1.5"/>
  <line x1="62" y1="110" x2="138" y2="110" stroke="#888" stroke-width="1.5"/>

  <!-- Grille dots -->
  <circle cx="72" cy="74" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="88" cy="74" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="104" cy="74" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="120" cy="74" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="80" cy="86" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="96" cy="86" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="112" cy="86" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="72" cy="98" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="88" cy="98" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="104" cy="98" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>
  <circle cx="120" cy="98" r="2.5" fill="#999" stroke="#000" stroke-width="1"/>

  <!-- Voice assistant LED indicator lights -->
  <line x1="78" y1="54" x2="122" y2="54" stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <circle cx="82" cy="53" r="4" fill="#00d4ff" stroke="#000" stroke-width="2"/>
  <circle cx="95" cy="53" r="4" fill="#00d4ff" stroke="#000" stroke-width="2"/>
  <circle cx="108" cy="53" r="4" fill="#00d4ff" stroke="#000" stroke-width="2"/>
  <circle cx="121" cy="53" r="4" fill="#00d4ff" stroke="#000" stroke-width="2"/>

  <!-- Control buttons -->
  <circle cx="90" cy="140" r="9" fill="#888" stroke="#000" stroke-width="2.5"/>
  <text x="90" y="143" text-anchor="middle" font-size="7" font-weight="bold" fill="#000" font-family="sans-serif">mic</text>

  <circle cx="115" cy="140" r="9" fill="#888" stroke="#000" stroke-width="2.5"/>
  <text x="115" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#000" font-family="sans-serif">&#x25B6;</text>

  <!-- Triangular base/stand -->
  <polygon points="100,150 60,168 140,168" fill="#bbb" stroke="#000" stroke-width="3" stroke-linejoin="round"/>

  <!-- Subtle body reflection -->
  <line x1="52" y1="48" x2="52" y2="130" stroke="#fff" stroke-width="2" opacity="0.6"/>
</svg>