<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Chunky drop shadow -->
  <ellipse cx="106" cy="168" rx="50" ry="14" fill="#222" opacity="0.9"/>

  <!-- Speaker body - cylindrical shape -->
  <rect x="50" y="40" width="100" height="120" rx="50" ry="50" fill="#1a1a1a" stroke="#000" stroke-width="3"/>

  <!-- Speaker grille area - concentric circles -->
  <circle cx="82" cy="100" r="35" fill="#2a2a2a" stroke="#000" stroke-width="3"/>
  <circle cx="82" cy="100" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="100" r="20" fill="#2a2a2a" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="100" r="12" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="100" r="5" fill="#ff4400" stroke="#000" stroke-width="2"/>

  <!-- Grille dots pattern -->
  <circle cx="82" cy="62" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="98" cy="65" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="108" cy="75" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="110" cy="90" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="66" cy="65" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="56" cy="75" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="54" cy="90" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="56" cy="108" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="66" cy="118" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="98" cy="118" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>
  <circle cx="108" cy="108" r="3" fill="#333" stroke="#000" stroke-width="1.5"/>

  <!-- Colorful accent stripe -->
  <rect x="50" y="55" width="100" height="10" rx="5" fill="#ff4400" stroke="#000" stroke-width="2.5"/>

  <!-- Control buttons -->
  <circle cx="124" cy="75" r="8" fill="#ff4400" stroke="#000" stroke-width="2.5"/>
  <text x="124" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" font-family="sans-serif">+</text>

  <circle cx="124" cy="100" r="8" fill="#ff4400" stroke="#000" stroke-width="2.5"/>
  <text x="124" y="103" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff" font-family="sans-serif">&#x25B6;</text>

  <circle cx="124" cy="125" r="8" fill="#ff4400" stroke="#000" stroke-width="2.5"/>
  <text x="124" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" font-family="sans-serif">&#x2212;</text>

  <!-- Stand/base feet -->
  <rect x="70" y="155" width="20" height="8" rx="4" fill="#ff4400" stroke="#000" stroke-width="2.5"/>
  <rect x="110" y="155" width="20" height="8" rx="4" fill="#ff4400" stroke="#000" stroke-width="2.5"/>

  <!-- Bluetooth icon -->
  <text x="140" y="52" text-anchor="middle" font-size="8" font-weight="bold" fill="#ff4400" stroke="#000" stroke-width="0.8" font-family="sans-serif">BT</text>
</svg>