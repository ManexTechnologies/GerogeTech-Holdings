<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drop shadow -->
  <rect x="23" y="78" width="164" height="64" rx="6" fill="#111" stroke="#000" stroke-width="3"/>

  <!-- Main body - thicker -->
  <rect x="20" y="75" width="164" height="64" rx="6" fill="#1a1a1a" stroke="#000" stroke-width="3"/>

  <!-- Edge highlight -->
  <rect x="20" y="75" width="164" height="8" rx="3" fill="#2a2a2a" stroke="#000" stroke-width="2"/>

  <!-- Digital display -->
  <rect x="40" y="92" width="60" height="28" rx="3" fill="#0a0a0a" stroke="#000" stroke-width="2"/>
  <rect x="42" y="94" width="56" height="24" rx="2" fill="#0d3d00" stroke="#000" stroke-width="1.5"/>

  <!-- Display text -->
  <text x="70" y="110" font-family="monospace" font-size="14" font-weight="bold" fill="#00ff55" text-anchor="middle">76%</text>

  <!-- USB-A Port 1 -->
  <rect x="155" y="88" width="14" height="16" rx="2" fill="#333" stroke="#000" stroke-width="2"/>
  <rect x="158" y="92" width="8" height="8" fill="#777" stroke="#000" stroke-width="1"/>

  <!-- USB-A Port 2 -->
  <rect x="155" y="110" width="14" height="16" rx="2" fill="#333" stroke="#000" stroke-width="2"/>
  <rect x="158" y="114" width="8" height="8" fill="#777" stroke="#000" stroke-width="1"/>

  <!-- USB-C Port -->
  <ellipse cx="170" cy="100" rx="4" ry="6" fill="#333" stroke="#000" stroke-width="2"/>
  <ellipse cx="170" cy="100" rx="2" ry="3" fill="#888" stroke="#000" stroke-width="1"/>

  <!-- LED -->
  <circle cx="112" cy="84" r="3" fill="#00ccff" stroke="#000" stroke-width="1.5"/>

  <!-- Label -->
  <text x="102" y="153" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ccc" text-anchor="middle">20000mAh</text>
</svg>