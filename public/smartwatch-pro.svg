<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drop shadow -->
  <rect x="56" y="66" width="88" height="78" rx="14" fill="#222" opacity="0.3"/>

  <!-- Top band -->
  <path d="M85 20 115 20 115 65 85 65Z" fill="#1a1a1a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Band texture lines top -->
  <line x1="90" y1="28" x2="110" y2="28" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="36" x2="110" y2="36" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="44" x2="110" y2="44" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="52" x2="110" y2="52" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="60" x2="110" y2="60" stroke="#333" stroke-width="2"/>

  <!-- Bottom band -->
  <path d="M85 135 115 135 115 180 85 180Z" fill="#1a1a1a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Band texture lines bottom -->
  <line x1="90" y1="142" x2="110" y2="142" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="150" x2="110" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="158" x2="110" y2="158" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="166" x2="110" y2="166" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="174" x2="110" y2="174" stroke="#333" stroke-width="2"/>

  <!-- Watch body / bezel -->
  <rect x="54" y="70" width="92" height="70" rx="12" fill="#2a2a2a" stroke="#000" stroke-width="3"/>

  <!-- AMOLED Screen -->
  <rect x="64" y="78" width="72" height="44" rx="6" fill="#0a0a1a" stroke="#000" stroke-width="2.5"/>

  <!-- Screen content - time -->
  <text x="100" y="97" text-anchor="middle" font-family="monospace, sans-serif" font-size="16" font-weight="bold" fill="#00ff88">12:45</text>

  <!-- Stats bar graph on screen -->
  <rect x="70" y="103" width="10" height="14" fill="#ff4466" stroke="#000" stroke-width="1.5"/>
  <rect x="83" y="106" width="10" height="11" fill="#44aaff" stroke="#000" stroke-width="1.5"/>
  <rect x="96" y="100" width="10" height="17" fill="#ffcc00" stroke="#000" stroke-width="1.5"/>
  <rect x="109" y="108" width="10" height="9" fill="#44ff88" stroke="#000" stroke-width="1.5"/>
  <rect x="122" y="104" width="10" height="13" fill="#ff8844" stroke="#000" stroke-width="1.5"/>

  <!-- Bottom screen label -->
  <text x="100" y="120" text-anchor="middle" font-family="monospace, sans-serif" font-size="6" fill="#888">STEPS 8,432</text>

  <!-- Digital crown / side button -->
  <rect x="146" y="82" width="10" height="14" rx="4" fill="#444" stroke="#000" stroke-width="2.5"/>

  <!-- Bezel highlight -->
  <rect x="58" y="74" width="84" height="4" rx="2" fill="#555" opacity="0.6"/>
</svg>