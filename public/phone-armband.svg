<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Drop shadow -->
  <rect x="54" y="54" width="82" height="112" rx="8" fill="black" opacity="0.3" />

  <!-- Armband strap - left side -->
  <rect x="28" y="50" width="22" height="60" rx="5" fill="#1A1A1A" stroke="black" stroke-width="3.5" />
  <!-- Strap texture lines left -->
  <line x1="32" y1="55" x2="46" y2="55" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="62" x2="46" y2="62" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="69" x2="46" y2="69" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="76" x2="46" y2="76" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="83" x2="46" y2="83" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="90" x2="46" y2="90" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="97" x2="46" y2="97" stroke="#333" stroke-width="1.5" />
  <line x1="32" y1="104" x2="46" y2="104" stroke="#333" stroke-width="1.5" />

  <!-- Armband strap - right side -->
  <rect x="140" y="50" width="22" height="60" rx="5" fill="#1A1A1A" stroke="black" stroke-width="3.5" />
  <!-- Strap texture lines right -->
  <line x1="144" y1="55" x2="158" y2="55" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="62" x2="158" y2="62" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="69" x2="158" y2="69" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="76" x2="158" y2="76" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="83" x2="158" y2="83" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="90" x2="158" y2="90" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="97" x2="158" y2="97" stroke="#333" stroke-width="1.5" />
  <line x1="144" y1="104" x2="158" y2="104" stroke="#333" stroke-width="1.5" />

  <!-- Strap connector - top -->
  <rect x="44" y="44" width="102" height="12" rx="4" fill="#222" stroke="black" stroke-width="3" />
  <!-- Strap connector - bottom -->
  <rect x="44" y="144" width="102" height="12" rx="4" fill="#222" stroke="black" stroke-width="3" />

  <!-- Main armband pouch body - black neoprene -->
  <rect x="44" y="48" width="102" height="102" rx="4" fill="#2C2C2C" stroke="black" stroke-width="3.5" />

  <!-- Mesh/fabric texture on body -->
  <rect x="48" y="52" width="94" height="94" rx="2" fill="none" stroke="#3A3A3A" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Phone inside the clear window -->
  <rect x="54" y="40" width="82" height="96" rx="5" fill="#1A1A2E" stroke="black" stroke-width="3" />

  <!-- Phone screen -->
  <rect x="58" y="44" width="74" height="80" rx="3" fill="#2ECC71" stroke="black" stroke-width="2.5" />

  <!-- Phone screen content - fitness app -->
  <!-- Running man icon (stick figure) -->
  <circle cx="82" cy="58" r="5" fill="none" stroke="white" stroke-width="2.5" />
  <line x1="82" y1="63" x2="82" y2="78" stroke="white" stroke-width="2.5" />
  <line x1="82" y1="68" x2="72" y2="62" stroke="white" stroke-width="2.5" />
  <line x1="82" y1="68" x2="92" y2="62" stroke="white" stroke-width="2.5" />
  <line x1="82" y1="78" x2="74" y2="86" stroke="white" stroke-width="2.5" />
  <line x1="82" y1="78" x2="90" y2="86" stroke="white" stroke-width="2.5" />

  <!-- Heart rate text -->
  <rect x="64" y="92" width="52" height="8" rx="2" fill="white" stroke="black" stroke-width="1" />
  <!-- Heart rate line -->
  <polyline points="66,96 72,96 76,92 80,100 84,96 90,96" fill="none" stroke="#FF4444" stroke-width="1.5" />

  <!-- Steps counter -->
  <rect x="64" y="104" width="22" height="12" rx="2" fill="#1A1A2E" stroke="black" stroke-width="1.5" />
  <text x="75" y="113" font-size="8" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">8.2k</text>

  <!-- Distance -->
  <rect x="90" y="104" width="30" height="12" rx="2" fill="#1A1A2E" stroke="black" stroke-width="1.5" />
  <text x="105" y="113" font-size="8" fill="#2ECC71" font-family="sans-serif" font-weight="bold" text-anchor="middle">4.3mi</text>

  <!-- Clear plastic window over phone -->
  <rect x="54" y="40" width="82" height="96" rx="5" fill="#FFFFFF" opacity="0.08" stroke="none" />
  <!-- Window glare -->
  <line x1="58" y1="52" x2="80" y2="44" stroke="white" stroke-width="1.5" opacity="0.4" />

  <!-- Velcro strap wrap-around -->
  <rect x="40" y="80" width="110" height="16" rx="3" fill="#111" stroke="black" stroke-width="3" />
  <!-- Velcro hook texture dots -->
  <circle cx="52" cy="88" r="2" fill="#444" />
  <circle cx="62" cy="88" r="2" fill="#444" />
  <circle cx="72" cy="88" r="2" fill="#444" />
  <circle cx="82" cy="88" r="2" fill="#444" />
  <circle cx="92" cy="88" r="2" fill="#444" />
  <circle cx="102" cy="88" r="2" fill="#444" />
  <circle cx="112" cy="88" r="2" fill="#444" />
  <circle cx="122" cy="88" r="2" fill="#444" />
  <circle cx="132" cy="88" r="2" fill="#444" />

  <!-- Brand logo on armband -->
  <rect x="78" y="154" width="34" height="8" rx="2" fill="#FF4444" stroke="black" stroke-width="2" />

  <!-- Stitching around main body -->
  <rect x="48" y="52" width="94" height="94" rx="2" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4" />
</svg>